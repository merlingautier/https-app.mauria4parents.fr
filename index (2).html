:root{--purple:#2c1e43;--paper:#fbfaf4;--muted:#65758b;--line:#dce2ec;--green:#4ca771;--orange:#cf824c;--peach:#fce6d7;--nav-muted:#99a1af;--shadow:0 5px 7px -4px #0003;--header-height:78px;--nav-height:100px;color-scheme:light;font-size:16px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper);scroll-behavior:smooth}
body{margin:0;color:#080808;background:var(--paper);font-family:Mauria,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button{color:inherit}
a{color:inherit}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a39ac0;outline-offset:4px}
button:focus:not(:focus-visible){outline:none}
button::-moz-focus-inner{border:0}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1,h2,.brand{font-family:Arial,Helvetica,sans-serif}
h1{font-size:38px;line-height:46px;color:var(--purple);font-weight:700;letter-spacing:-.25px}
h2{font-size:30px;line-height:36px;color:var(--purple);font-weight:700}
.icon{display:inline-block;width:24px;height:24px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:fixed;top:-80px;left:20px;z-index:100;background:white;padding:12px 20px;border-radius:8px;color:var(--purple)}
.skip-link:focus{top:10px}
.site-header{height:var(--header-height);background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;z-index:2}
.brand{font-size:30px;font-weight:700;letter-spacing:-.4px;text-decoration:none;line-height:1}
.header-menu{width:45px;height:45px;border:0;background:transparent;color:white;display:grid;place-items:center;padding:5px}
.header-menu .icon{width:32px;height:32px;stroke-width:2}
.ambient{position:fixed;inset:var(--header-height) 0 var(--nav-height);pointer-events:none;overflow:hidden;z-index:0}
.ambient svg{height:100%;width:100%;display:block}
.page-content{padding:20px 18px calc(var(--nav-height) + 28px);min-height:calc(100dvh - var(--header-height));position:relative;z-index:1}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:46px}
.page-actions{display:flex;gap:10px;align-items:center}
.card{background:#fff;border-radius:10px;box-shadow:var(--shadow);border:0}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:45px;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:#fcfaf8;font-size:18px;font-weight:500;line-height:24px;text-decoration:none}
.button:hover{filter:brightness(.975)}
.button-primary{border-color:var(--purple);background:var(--purple);color:#fff}
.button-muted{border-color:transparent;background:#eeedf0;color:var(--purple)}
.button-danger{border:1px solid #edc2bb;color:#a74337;background:#fff6f3}
.icon-button{padding:0;width:45px;min-width:45px;height:45px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:var(--purple);color:white}
.icon-button .icon{width:22px;height:22px}

.nt-grade-list{display:grid;gap:20px}

.nt-grade-card:hover{box-shadow:0 4px 8px #2c1e4324}
.nt-grade-card:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.nt-score-block{text-align:center;padding-right:18px;white-space:nowrap}
.nt-score-line{display:flex;align-items:flex-start;justify-content:center;gap:3px}
.nt-score{font-size:30px;font-weight:700;line-height:36px;letter-spacing:.2px}
.nt-good{color:var(--green)}
.nt-below{color:var(--orange)}
.nt-weight{font-size:12px;line-height:20px;font-weight:500;color:#9aa5b6}
.nt-average{font-size:17px;color:#788396;line-height:25px}
.nt-grade-copy{min-width:0;padding-right:14px}
.nt-grade-name{font-size:22px;line-height:29px;font-weight:500;margin:0 0 3px}
.nt-grade-date{font-size:17px;line-height:24px;color:#778196}
.nt-grade-right{height:66px;display:flex;align-items:flex-end;justify-content:space-between;flex-direction:column}
.nt-grade-right .badge{font-size:14px;padding:7px 11px;white-space:nowrap}
.nt-grade-right svg{width:15px;height:15px;color:#b1bdcf}
.nt-grade-sheet{height:804px;max-height:calc(100dvh - 64px);background:#fcfaf8}
.nt-grade-sheet .sheet-title{font-size:22px;line-height:28px;font-weight:500;margin-bottom:40px;color:#080808}
.nt-details{color:#080808}
.nt-detail-name{font-size:22px;line-height:28px;font-weight:500;margin:0}
.nt-course-code{font-size:18px;line-height:24px;color:#798aa3;margin:4px 0 21px;overflow-wrap:anywhere}
.nt-no-code{margin-bottom:22px}
.nt-grade-label,.nt-distribution-heading{font-size:18px;line-height:25px;font-weight:500;margin:0}
.nt-detail-score{font-size:32px;line-height:40px;font-weight:700;margin:0;display:block}
.nt-distribution-heading{margin-top:20px}
.nt-chart{position:relative;height:150px;margin:0;isolation:isolate}
.nt-chart-track{position:absolute;top:59px;left:0;right:0;height:15px;border-radius:12px;background:#f1f5f9;overflow:hidden}
.nt-chart-fill{height:100%;background:#a9e3c3;border-radius:12px}
.nt-chart-end{position:absolute;top:80px;font-size:11px;line-height:16px;color:#c4ccd5}
.nt-chart-end.is-start{left:0}
.nt-chart-end.is-end{right:0}
.nt-chart-marker{position:absolute;top:58px;width:2px;height:20px;transform:translateX(-1px);background:#aebdd0;z-index:2}
.nt-chart-marker::after{content:"";position:absolute;top:23px;left:0;width:1px;height:4px;background:#c6cfdb}
.nt-chart-number,.nt-chart-caption{position:absolute;left:50%;white-space:nowrap;transform:translateX(-50%);color:#798ba5;font-size:12px;line-height:18px}
.nt-chart-number{bottom:23px;font-weight:500}
.nt-chart-caption{top:28px;font-weight:400}
.nt-chart-student{position:absolute;top:55px;transform:translateX(-50%);width:25px;height:25px;border-radius:50%;border:3px solid #fff;background:#22c35d;z-index:4}
.nt-chart-score{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;line-height:26px;white-space:nowrap;border-radius:18px;padding:0 10px;color:#fff;background:#22c35d}
.nt-chart-score::after{content:"";position:absolute;bottom:-10px;left:50%;height:10px;width:1px;background:#22c35d}
.nt-chart-deviation{position:absolute;top:109px;height:2px;background:#c7cdd5}
.nt-chart-deviation::before,.nt-chart-deviation::after{content:"";position:absolute;top:-4px;height:10px;width:1px;background:#b4c0ce}
.nt-chart-deviation::before{left:0}.nt-chart-deviation::after{right:0}
.nt-chart-deviation span{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:11px;color:#a2afc1;white-space:nowrap}
.nt-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 20px;border-top:2px solid #e2e8f0;padding-top:20px;margin:0}
.nt-stat-grid>div{min-width:0}
.nt-stat-grid dt{font-size:18px;font-weight:500;line-height:26px;margin:0}
.nt-stat-grid dd{font-size:20px;line-height:28px;margin:0}
.nt-stat-grid .nt-date-stat{grid-column:1/-1}
.nt-unavailable{font-size:16px;color:var(--muted);line-height:1.6;margin:25px 0}
.nt-short-stats{margin-top:25px}
@media(max-width:700px){
 .nt-filters{gap:8px;margin-bottom:20px}
 .nt-filters .filter-button{font-size:15px;min-height:42px;padding:8px 13px}
 .nt-notice{font-size:12px;align-items:flex-start;line-height:18px}
 .nt-notice svg{margin-top:2px}
 .nt-grade-list{gap:14px}
 .nt-grade-card{grid-template-columns:85px minmax(0,1fr);padding:16px 12px;min-height:116px;position:relative}
 .nt-score-block{padding-right:10px;grid-row:1/3}
 .nt-score{font-size:26px;line-height:32px}
 .nt-weight{font-size:10px;line-height:16px}
 .nt-average{font-size:13px;line-height:22px}
 .nt-grade-name{font-size:17px;line-height:23px;margin-bottom:4px}
 .nt-grade-date{font-size:14px;line-height:20px}
 .nt-grade-right{height:auto;grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;margin-top:8px}
 .nt-grade-right .badge{font-size:12px;padding:4px 8px}
 .nt-grade-sheet{height:auto;max-height:92dvh}
 .nt-grade-sheet .sheet-title{font-size:20px;margin-bottom:28px}
 .nt-detail-name{font-size:20px;line-height:27px}
 .nt-course-code{font-size:13px;line-height:19px}
 .nt-chart{height:188px}
 .nt-chart-number{font-size:10px}
 .nt-chart-caption{font-size:10px}
 .nt-chart-marker.nt-marker-mean .nt-chart-caption{top:70px}
 .nt-chart-marker.nt-marker-median .nt-chart-number{top:31px;bottom:auto}
 .nt-chart-marker.nt-marker-median .nt-chart-caption{top:49px}
 .nt-chart-deviation{top:157px}
 .nt-chart-score{font-size:12px;padding:0 7px}
 .nt-stat-grid{gap:18px 12px;padding-top:18px}
 .nt-stat-grid dt{font-size:15px;line-height:22px}
 .nt-stat-grid dd{font-size:18px;line-height:26px}
}

<body>
<!-- Fichier autonome : les styles, polices, icônes et scripts sont intégrés.
     Les données des captures de novembre 2026 sont regroupées dans les scripts.
     Les tâches et événements ajoutés sont conservés uniquement dans ce navigateur. -->
<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="site-header">
  <a class="brand" href="#accueil" aria-label="Mauria, accueil">Mauria</a>
  <button id="menu-button" class="header-menu" type="button" aria-label="Ouvrir le menu" aria-haspopup="dialog" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18M3 12h18M3 20h18"/></svg>
  </button>
</header>
<div id="ambient" class="ambient" aria-hidden="true"></div>
<main id="contenu" class="page-content" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Navigation principale" id="bottom-nav"></nav>
<dialog id="app-sheet" class="dialog-sheet" aria-labelledby="sheet-title">
  <button class="sheet-handle" type="button" aria-label="Fermer la fenêtre"></button>
  <div class="sheet-inner"><h2 id="sheet-title" class="sheet-title"></h2><div id="sheet-content"></div></div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:30px;color:#2c1e43">Active JavaScript dans ton navigateur pour afficher les onglets de Mauria.</p></noscript>
<script>
'use strict';

/* Mauria : interface autonome, données de référence du 19 novembre 2026. */
(() => {
  const paths = {
    home: '<path d="m3 10 9-8 9 8v10a2 2 0 0 1-2 2h-4V12H9v10H5a2 2 0 0 1-2-2z"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    'graduation-cap': '<path d="m2 9 10-4 10 4-10 4L2 9Z"/><path d="M6 11v5c0 3 12 3 12 0v-5M22 9v6"/>',
    user: '<circle cx="12" cy="7" r="4"/><path d="M5 22v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3"/>',
    'list-check': '<path d="m3 6 2 2 4-4m-6 13 2 2 4-4M13 5h8M13 12h8M13 19h8"/>',
    clipboard: '<rect x="4" y="4" width="16" height="18" rx="2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M10 11h6M10 16h6M7 11h.01M7 16h.01"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    x: '<path d="m6 6 12 12M6 18 18 6"/>',
    search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
    'chevron-left': '<path d="m15 5-7 7 7 7"/>',
    'chevron-right': '<path d="m9 5 7 7-7 7"/>',
    'chevron-down': '<path d="m5 9 7 7 7-7"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.8"/>',
    external: '<path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7M21 12V5a2 2 0 0 0-2-2M13 13l8 8M15 21h6v-6"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
    trash: '<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',
    edit: '<path d="m16 3 5 5L9 20l-6 1 1-6L16 3ZM14 5l5 5"/>',
    briefcase: '<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12c6 4 12 4 18 0M10 13h4"/>',
    check: '<path d="m5 12 4 4L19 6"/>'
  };
  const icon = (name, className = '') => `<svg class="icon ${className}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${paths[name] || paths.info}</svg>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const memory = new Map();
  const read = (key, fallback) => {
    if (memory.has(key)) return memory.get(key);
    try { const raw = localStorage.getItem('mauria-v1-' + key); return raw === null ? fallback : JSON.parse(raw); }
    catch { return memory.has(key) ? memory.get(key) : fallback; }
  };
  const write = (key, value) => {
    memory.set(key, value);
    try { localStorage.setItem('mauria-v1-' + key, JSON.stringify(value)); return true; }
    catch { toast('Enregistrement temporaire : le stockage de ce navigateur est indisponible.'); return false; }
  };
  const sheet = document.getElementById('app-sheet');
  let sheetReturnFocus = null;
  let toastTimer;
  function toast(message) {
    const el = document.getElementById('toast');
    clearTimeout(toastTimer);
    el.textContent = message;
    el.hidden = false;
    toastTimer = setTimeout(() => { el.hidden = true; }, 3600);
  }
  function closeSheet() { if (sheet.open) sheet.close(); }
  function openSheet({title, content, className = '', onOpen}) {
    if (sheet.open) sheet.close();
    sheetReturnFocus = document.activeElement;
    sheet.className = 'dialog-sheet ' + className;
    document.getElementById('sheet-title').textContent = title;
    document.getElementById('sheet-content').innerHTML = content;
    sheet.showModal();
    document.body.style.overflow = 'hidden';
    sheet.scrollTop = 0;
    if (onOpen) onOpen(sheet);
    const field = sheet.querySelector('[autofocus]');
    if (field) field.focus({preventScroll:true});
  }
  sheet.querySelector('.sheet-handle').addEventListener('click', closeSheet);
  sheet.addEventListener('click', event => {
    if (event.target === sheet) {
      const r = sheet.getBoundingClientRect();
      if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) closeSheet();
    }
  });
  sheet.addEventListener('close', () => {
    if (sheet.open) return;
    document.body.style.overflow = '';
    document.getElementById('menu-button').setAttribute('aria-expanded','false');
    if (sheetReturnFocus?.isConnected) sheetReturnFocus.focus({preventScroll:true});
  });
  window.Mauria = {icon, esc, read, write, openSheet, closeSheet, toast};

  const views = [
    {id:'accueil',title:'Accueil',icon:'home'},
    {id:'planning',title:'Planning',icon:'calendar'},
    {id:'notes',title:'Notes',icon:'graduation-cap'},
    {id:'absences',title:'Absences',icon:'user'},
    {id:'agenda',title:'Agenda',icon:'list-check'}
  ];
  const main = document.getElementById('contenu');
  let currentPage = '';
  let absenceFilter = 'all';
  const absences = [
    {hours:3,justified:true,course:'[ADI1] Electronique numérique 1',date:'lundi 16 nov., 09:00 - 12:00'},
    {hours:1,justified:true,course:'[ADI1] Projet de Semestre 1 - [ADI2] Projet de Semestre 3',date:'vendredi 23 oct., 13:30 - 17:00'},
    {hours:3,justified:true,course:'[ADI1] Projet de Semestre 1 - [ADI2] Projet de Semestre 3',date:'jeudi 22 oct., 09:00 - 12:00'}
  ];
  function renderAmbient() {
    let seed = 1182026;
    const rnd = () => { seed = (1664525 * seed + 1013904223) >>> 0; return seed / 4294967296; };
    let circles = '';
    for (let i = 0; i < 110; i++) {
      const x = Math.round(rnd()*1920), y = Math.round(rnd()*800), r = (1.4+rnd()*1.8).toFixed(1), opacity=(.12+rnd()*.47).toFixed(2);
      circles += `<circle cx="${x}" cy="${y}" r="${r}" opacity="${opacity}"/>`;
    }
    document.getElementById('ambient').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="none" fill="#f6ad94">${circles}</svg>`;
  }
  function renderHome() {
    main.innerHTML = `<h1>Hello Merlin !</h1>
      <aside class="announcement" aria-label="Actualité"><strong>Menu Stages disponible dans la sidebar&nbsp;!</strong><p>Stages, alternances, jobs saisonniers et anciens stages Junia t'attendent ! Des améliorations continues arriveront les prochains jours</p><div class="announcement-tracks" aria-hidden="true"><span class="announcement-track"></span><span class="announcement-track"></span></div></aside>
      <section class="home-section" aria-labelledby="now-title"><h2 id="now-title">En ce moment</h2>
        <button class="card home-course" id="home-current-course" type="button" aria-label="Voir Travail personnel : temps de révisions, de 13:30 à 15:30">
          <span class="home-course-head"><span class="home-course-title">Travail personnel : temps de révisions</span><span class="badge">Auto-apprentissage</span></span>
          <span class="home-course-meta"><span class="meta-time">${icon('clock')}13:30 - 15:30</span><span class="meta-room">${icon('pin')}J104 COURS</span>${icon('external','course-expand')}</span>
        </button>
      </section>
      <section class="home-section" aria-labelledby="today-title"><h2 id="today-title">Aujourd'hui</h2>
        <button class="card home-course" id="home-next-course" type="button" aria-label="Voir Associatif, de 15:30 à 17:30">
          <span class="home-course-head"><span class="home-course-title"></span><span class="badge">Associatif</span></span>
          <span class="home-course-meta"><span class="meta-time">${icon('clock')}15:30 - 17:30</span><span class="meta-room">${icon('pin')}J006 BDE</span>${icon('external','course-expand')}</span>
        </button>
      </section>`;
    document.getElementById('home-current-course').addEventListener('click', () => window.MauriaPlanning.showEvent('ref-revisions'));
    document.getElementById('home-next-course').addEventListener('click', () => window.MauriaPlanning.showEvent('ref-asso'));
  }
  function renderAbsences() {
    const filters = [['all','Tout'],['yes','Justifié'],['no','Non justifié']];
    const totalHours = absences.reduce((total, absence) => total + absence.hours, 0);
    const justifiedHours = absences.reduce((total, absence) => total + (absence.justified ? absence.hours : 0), 0);
    const unjustifiedHours = totalHours - justifiedHours;
    const formatHours = hours => { const minutes = Math.round(hours * 60); return `${Math.floor(minutes / 60)}h${String(minutes % 60).padStart(2, '0')}`; };
    const filteredAbsences = absences.filter(a=>absenceFilter==='all'||(absenceFilter==='yes' ? a.justified : !a.justified));
    const emptyMessage = absenceFilter === 'no' ? 'Aucune absence injustifiée.' : absenceFilter === 'yes' ? 'Aucune absence justifiée.' : 'Aucune absence.';
    main.innerHTML = `<h1 class="sr-only">Absences</h1>
      <div class="filter-bar" role="group" aria-label="Filtrer les absences">${filters.map(([key,label])=>`<button class="filter-button" type="button" data-filter="${key}" aria-pressed="${absenceFilter===key}">${label}</button>`).join('')}</div>
      <section class="card absence-summary" aria-label="Bilan des absences">
        <div class="absence-total"><span class="absence-total-label">Total</span><strong>${formatHours(totalHours)}</strong></div><div class="absence-rule"></div>
        <div class="absence-breakdown"><div class="absence-stat"><div class="absence-stat-label">Justifiées</div><div class="absence-stat-value">${formatHours(justifiedHours)}</div></div><div class="absence-stat unjustified"><div class="absence-stat-label">Injustifiées</div><div class="absence-stat-value">${formatHours(unjustifiedHours)}</div></div></div>
      </section>
      <div class="absence-list" aria-live="polite">${filteredAbsences.length ? filteredAbsences.map(a=>`<article class="card absence-card ${a.justified?'':'is-unjustified'}"><div class="absence-duration">${formatHours(a.hours)}</div><div><h3>${a.justified?'Absence excusée avec justificatif':'Absence non excusée'}</h3><p class="absence-course">${esc(a.course)}</p><p class="absence-date">${esc(a.date)}</p></div></article>`).join('') : `<p class="card absence-empty">${emptyMessage}</p>`}</div>`;
    main.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{absenceFilter=btn.dataset.filter;renderAbsences();main.querySelector(`[data-filter="${absenceFilter}"]`).focus({preventScroll:true});}));
  }
  function getTasks() {
    const value = read('tasks', []);
    if (!Array.isArray(value)) return [];
    return value.filter(t=>t && typeof t.id==='string' && typeof t.title==='string').map(t=>({...t,done:Boolean(t.done)}));
  }
  function formatDate(date) {
    if (!date) return '';
    const value = new Date(date+'T12:00:00');
    return Number.isNaN(value.getTime()) ? '' : value.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  function renderAgenda() {
    const tasks=getTasks();
    main.innerHTML=`<div class="page-heading"><h1>Mon agenda</h1><button class="icon-button" id="add-task-top" type="button" aria-label="Ajouter une tâche">${icon('plus')}</button></div>
    ${tasks.length===0 ? `<section class="card agenda-empty" aria-label="Agenda vide"><div class="agenda-empty-icon">${icon('clipboard')}</div><h2>Aucune tâche.</h2><p>Aucune tâche n'a été ajoutée pour le moment.</p><button type="button" class="button button-primary" id="add-task-empty">${icon('plus')}Ajouter une tâche</button></section>`:
    `<section class="agenda-tasks" aria-label="Mes tâches"><p class="task-summary">${tasks.filter(t=>!t.done).length} tâche${tasks.filter(t=>!t.done).length>1?'s':''} à terminer · ${tasks.filter(t=>t.done).length} terminée${tasks.filter(t=>t.done).length>1?'s':''}</p>${tasks.map(t=>`<article class="card task-item ${t.done?'is-done':''}"><input class="task-check" type="checkbox" data-complete="${esc(t.id)}" ${t.done?'checked':''} aria-label="Marquer ${esc(t.title)} comme ${t.done?'à faire':'terminée'}"><div class="task-body"><button type="button" class="task-title" data-edit="${esc(t.id)}">${esc(t.title)}</button>${t.description?`<p class="task-description">${esc(t.description)}</p>`:''}${t.date?`<p class="task-date">${icon('calendar')}${esc(formatDate(t.date))}</p>`:''}</div><button class="task-delete" type="button" data-delete="${esc(t.id)}" aria-label="Supprimer ${esc(t.title)}">${icon('trash')}</button></article>`).join('')}</section>`}`;
    document.getElementById('add-task-top').addEventListener('click',()=>taskForm());
    document.getElementById('add-task-empty')?.addEventListener('click',()=>taskForm());
    main.querySelectorAll('[data-complete]').forEach(el=>el.addEventListener('change',()=>{
      const list=getTasks();const task=list.find(t=>t.id===el.dataset.complete);if(task)task.done=el.checked;write('tasks',list);renderAgenda();
    }));
    main.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>taskForm(el.dataset.edit)));
    main.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{
      write('tasks',getTasks().filter(t=>t.id!==el.dataset.delete));renderAgenda();toast('Tâche supprimée.');
    }));
  }

    { id: 'maths-project', title: 'Projet Mathématiques 2 S1', category: 'Maths', score: 17.20, mean: 17.66, coefficient: 30, date: 'mardi 13 oct. 2026' },
    { id: 'maths-continuous', title: 'Contrôle continu Mathématiques 1 S1', category: 'Maths', score: 17.40, mean: 17.15, coefficient: 5, date: 'jeudi 1 oct. 2026' },
    { id: 'maths-intermediate', title: 'Epreuve Intermédiaire Mathématiques 2 S1', category: 'Maths', score: 18.00, mean: 11.54, coefficient: 20, date: 'jeudi 24 sept. 2026', code: '2627_ADIMAKER_BORDEAUX_A1_MATHS02_EI', min: 1.75, max: 19.25, median: 12.63, deviation: 4.73 },
    { id: 'arduino-continuous', title: 'Contrôle Continu C-microcontrôleur S1', category: 'Informatique', score: 18.50, mean: 15.88, coefficient: 1, date: 'mercredi 2 sept. 2026', code: '2627_ADIMAKER_BORDEAUX_A1_INFO1_CARDUINO_CC', min: 9.00, max: 18.50, median: 17.00, deviation: 2.94 }
  ];
  let selectedFilter = 'Toutes';
  const scoreText = value => value.toFixed(2);
  const paddedText = value => value.toFixed(2).padStart(5, '0');
  const percentage = value => Math.max(0, Math.min(100, value * 5));

  function gradeCard(grade) {
    const M = window.Mauria;
    const color = grade.score >= grade.mean ? 'nt-good' : 'nt-below';
    return `<button class="card nt-grade-card" type="button" data-grade="${grade.id}" aria-label="${M.esc(grade.title)}, ${scoreText(grade.score)} sur 20, voir les détails">
      <span class="nt-score-block"><span class="nt-score-line"><span class="nt-score ${color}">${scoreText(grade.score)}</span><span class="nt-weight" aria-label="coefficient ${grade.coefficient}">×${grade.coefficient}</span></span><span class="nt-average">Moy. ${paddedText(grade.mean)}</span></span>
      <span class="nt-grade-copy"><span class="nt-grade-name" style="display:block">${M.esc(grade.title)}</span><span class="nt-grade-date">${M.esc(grade.date)}</span></span>
      <span class="nt-grade-right"><span class="badge">${grade.category}</span>${M.icon('external')}</span>
    </button>`;
  }

  function distribution(grade) {
    const markers = [
      ['min', grade.min, 'Min'],
      ['mean', grade.mean, 'Moyenne'],
      ['median', grade.median, 'Médiane'],
      ['max', grade.max, 'Max']
    ].map(([kind, value, caption]) => `<span class="nt-chart-marker nt-marker-${kind}" style="left:${percentage(value)}%"><span class="nt-chart-number">${value}</span><span class="nt-chart-caption">${caption}</span></span>`).join('');
    const low = percentage(grade.mean - grade.deviation);
    const high = percentage(grade.mean + grade.deviation);
    return `<h4 class="nt-distribution-heading">Position dans la classe</h4>
      <figure class="nt-chart" role="img" aria-label="Note ${scoreText(grade.score)} sur 20. Minimum ${scoreText(grade.min)}, moyenne ${scoreText(grade.mean)}, médiane ${scoreText(grade.median)}, maximum ${scoreText(grade.max)}. Écart-type ${scoreText(grade.deviation)}.">
        <span class="nt-chart-track"><span class="nt-chart-fill" style="display:block;width:${percentage(grade.score)}%"></span></span>
        <span class="nt-chart-end is-start">0</span><span class="nt-chart-end is-end">20</span>
        ${markers}
        <span class="nt-chart-student" style="left:${percentage(grade.score)}%"><span class="nt-chart-score">${scoreText(grade.score)}/20</span></span>
        <span class="nt-chart-deviation" style="left:${low}%;width:${high - low}%"><span>Écart-type</span></span>
      </figure>`;
  }

  function stat(label, value, className = '') {
    return `<div${className ? ` class="${className}"` : ''}><dt>${label}</dt><dd>${window.Mauria.esc(value)}</dd></div>`;
  }

  function showGrade(id) {
    const grade = grades.find(item => item.id === id);
    if (!grade) return;
    const M = window.Mauria;
    const hasFullStatistics = Number.isFinite(grade.min);
    const statistics = hasFullStatistics
      ? `${distribution(grade)}<dl class="nt-stat-grid">${stat('Moyenne', paddedText(grade.mean))}${stat('Médiane', paddedText(grade.median))}${stat('Min', paddedText(grade.min))}${stat('Max', paddedText(grade.max))}${stat('Écart-type', paddedText(grade.deviation))}${stat('Coefficient', String(grade.coefficient))}${stat('Date', grade.date, 'nt-date-stat')}</dl>`
      : `<dl class="nt-stat-grid nt-short-stats">${stat('Moyenne', paddedText(grade.mean))}${stat('Coefficient', String(grade.coefficient))}${stat('Date', grade.date, 'nt-date-stat')}</dl><p class="nt-unavailable">Les autres statistiques de cette épreuve ne figurent pas dans les captures fournies.</p>`;
    M.openSheet({
      title: 'Détails de la note',
      className: 'nt-grade-sheet',
      content: `<article class="nt-details"><h3 class="nt-detail-name${grade.code ? '' : ' nt-no-code'}">${M.esc(grade.title)}</h3>${grade.code ? `<p class="nt-course-code">${M.esc(grade.code)}</p>` : ''}<p class="nt-grade-label">Note</p><strong class="nt-detail-score">${scoreText(grade.score)}</strong>${statistics}</article>`
    });
  }

  function render(container) {
    const M = window.Mauria;
    container.innerHTML = `<h1 class="sr-only">Notes</h1><section class="nt-view" aria-label="Mes notes"><div class="filter-bar nt-filters" role="group" aria-label="Filtrer les notes">${['Toutes', 'Informatique', 'Maths'].map(filter => `<button type="button" class="filter-button${selectedFilter === filter ? ' is-active' : ''}" data-note-filter="${filter}" aria-pressed="${selectedFilter === filter}">${filter}</button>`).join('')}</div><div class="card nt-notice">${M.icon('info')}<span>Les moyennes ne sont pas encore supportées pour ta classe.</span></div><div class="nt-grade-list">${grades.filter(grade => selectedFilter === 'Toutes' || grade.category === selectedFilter).map(gradeCard).join('')}</div></section>`;
    container.querySelectorAll('[data-note-filter]').forEach(button => {
      button.addEventListener('click', () => {
        selectedFilter = button.dataset.noteFilter;
        render(container);
        container.querySelector(`[data-note-filter="${selectedFilter}"]`).focus({ preventScroll: true });
      });
    });
    container.querySelectorAll('[data-grade]').forEach(button => button.addEventListener('click', () => showGrade(button.dataset.grade)));
  }

  window.MauriaNotes = { render, showGrade };
}());

window.Mauria.start();

</script>
</body>
</html>
